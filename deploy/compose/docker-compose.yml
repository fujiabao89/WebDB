# P0 最小本地部署定义
# 一条命令启动：docker compose -f deploy/compose/docker-compose.yml up -d --wait
# 不含真实凭证、生产连接信息或暴露到外网的端口。
#
# 服务说明：
#   webdb-meta    WebDB 元数据库 (PostgreSQL)     → 127.0.0.1:5432
#   demo-pg       演示 PostgreSQL + 合成数据       → 127.0.0.1:5433
#   demo-mysql    演示 MySQL 8.4 + 合成数据        → 127.0.0.1:3306
#   api-migrate   one-shot 迁移（api migrate up） → 退出即成功
#   demo-seed     one-shot 演示 seed（WEBDB_DEMO_SEED=true）→ 退出即成功
#   api           Go API / 执行服务                → 127.0.0.1:8080
#   web           React 前端 (Vite 开发服务器)       → 127.0.0.1:3000
#
# 启动依赖链（fail-closed）：
#   webdb-meta healthy → api-migrate completed → demo-seed completed → api healthy → web healthy
#   api-migrate 失败时 demo-seed/api/web 均不启动；demo-seed 失败时 api/web 均不启动。
#   demo-seed 仅在 WEBDB_DEMO_SEED=true 时执行，生产部署无此开关则绝不自动 seed。

name: webdb-p0

services:
  # ============================================================
  # WebDB 元数据库 — 存储用户、工作区、连接配置、审计等
  # ============================================================
  webdb-meta:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webdb
      POSTGRES_PASSWORD: ${META_DB_PASSWORD:-change_me}
      POSTGRES_DB: webdb_meta
      # 运行时最小权限账号密码（与 api 服务 WEBDB_APP_PASSWORD 一致）；仅本地合成值。
      WEBDB_APP_PASSWORD: ${WEBDB_APP_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - webdb-meta-data:/var/lib/postgresql/data
      # 首次初始化创建运行时最小权限账号 webdb_app_runtime（WEB-40 runtime/migration 分离）
      - ./init/webdb-meta:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 强制 --host=127.0.0.1 走 TCP：PG 首次初始化期间临时服务器仅监听 Unix socket，
      # 避免 api-migrate 依赖的 TCP 5432 尚未就绪时被误判为 healthy（与 demo-pg 一致）。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U webdb -d webdb_meta"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - webdb-backend
    restart: unless-stopped

  # ============================================================
  # 演示 PostgreSQL — 含合成数据与只读账号
  # ============================================================
  demo-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DEMO_PG_USER:-demo_admin}
      POSTGRES_PASSWORD: ${DEMO_PG_PASSWORD:-change_me}
      POSTGRES_DB: webdb_demo
      DEMO_PG_READER_PASSWORD: ${DEMO_PG_READER_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - demo-pg-data:/var/lib/postgresql/data
      - ./init/demo-pg:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 验证初始化完成：检查 employees sentinel 表存在
      # 强制 --host=127.0.0.1 走 TCP：初始化期间的临时服务器仅监听 Unix socket，
      # 避免最终 TCP 监听尚未就绪时被误判为 healthy（密码经环境变量传入，不进 argv）
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql --host=127.0.0.1 -U ${DEMO_PG_USER:-demo_admin} -d webdb_demo -t -c \"SELECT 1 FROM employees LIMIT 1;\" | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - webdb-backend
    restart: unless-stopped

  # ============================================================
  # 演示 MySQL 8.4 LTS — 含合成数据与只读账号
  # digest: sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
  # ============================================================
  demo-mysql:
    image: mysql:8.4@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: webdb_demo
      MYSQL_USER: ${DEMO_MYSQL_USER:-demo_reader}
      # 只读账号密码通过 init 脚本安全设置，绕过 MySQL 入口点对特殊字符的限制
      DEMO_MYSQL_READER_PASSWORD: ${DEMO_MYSQL_READER_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - demo-mysql-data:/var/lib/mysql
      - ./init/demo-mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 验证初始化完成：检查 employees sentinel 表存在
      # 强制 --protocol=tcp 连 127.0.0.1：初始化期间的临时服务器仅监听 Unix socket，
      # 避免最终 TCP 监听尚未就绪时被误判为 healthy
      test: ['CMD-SHELL', 'mysql --protocol=tcp --host=127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" webdb_demo -e "SELECT 1 FROM employees LIMIT 1;" 2>/dev/null | grep -q 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - webdb-backend
    restart: unless-stopped

  # ============================================================
  # one-shot 迁移服务 — 空卷元数据库首次启动前执行 migrate up
  # 使用独立管理员 META_MIGRATE_USER（迁移需 DDL 权限）；
  # 成功退出（completed_successfully）后 demo-seed 才会运行；
  # 失败时整条链路（seed/api/web）均不启动，且不会无限重启。
  # ============================================================
  api-migrate:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: dev
    command: ["migrate", "up"]
    environment:
      META_DB_HOST: webdb-meta
      META_DB_PORT: "5432"
      META_MIGRATE_USER: webdb
      META_MIGRATE_PASSWORD: ${META_DB_PASSWORD:-change_me}
      META_DB_USER: webdb
      META_DB_PASSWORD: ${META_DB_PASSWORD:-change_me}
      META_DB_NAME: webdb_meta
    depends_on:
      webdb-meta:
        condition: service_healthy
    restart: "no"
    networks:
      - webdb-backend

  # ============================================================
  # one-shot 演示 seed 服务 — 仅 WEBDB_DEMO_SEED=true 时执行
  # 创建固定合成 workspace/user/member(owner)、两条演示连接 +
  # allow_read 策略，以及经 LifecycleManager 加密的演示凭证。
  # 演示数据库密码与 KEK 仅通过 env 注入，绝不写入 SQL/文件/命令行/日志；
  # 幂等可重复，固定 ID 冲突 fail-closed。
  # ============================================================
  demo-seed:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: dev
    command: ["seed-demo"]
    environment:
      WEBDB_DEMO_SEED: "true"
      DEMO_PRINCIPAL_WORKSPACE_ID: ${DEMO_PRINCIPAL_WORKSPACE_ID:-f1160d75-26f7-46e0-b3e0-570ea65c232e}
      DEMO_PRINCIPAL_USER_ID: ${DEMO_PRINCIPAL_USER_ID:-73e8c8f0-83e4-4096-8400-15ca15073d6b}
      META_DB_HOST: webdb-meta
      META_DB_PORT: "5432"
      META_DB_USER: webdb
      META_DB_PASSWORD: ${META_DB_PASSWORD:-change_me}
      META_DB_NAME: webdb_meta
      DEMO_PG_HOST: demo-pg
      DEMO_PG_PORT: "5432"
      DEMO_PG_NAME: webdb_demo
      DEMO_PG_READER_PASSWORD: ${DEMO_PG_READER_PASSWORD:-change_me}
      DEMO_MYSQL_HOST: demo-mysql
      DEMO_MYSQL_PORT: "3306"
      DEMO_MYSQL_NAME: webdb_demo
      DEMO_MYSQL_USER: ${DEMO_MYSQL_USER:-demo_reader}
      DEMO_MYSQL_READER_PASSWORD: ${DEMO_MYSQL_READER_PASSWORD:-change_me}
      # KEK 仅 env 注入；缺失/非法时 seed fail-closed（不会静默跳过）。
      # 本地演示请复制 env.example 到 .env 并填入合成 demo KEK。
      WEBDB_KEK_V1: ${WEBDB_KEK_V1:-}
      WEBDB_ACTIVE_KEK_VERSION: ${WEBDB_ACTIVE_KEK_VERSION:-1}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - webdb-backend

  # ============================================================
  # API 服务 — 唯一可连接目标数据库的组件
  # dev target: golang:1.26-bookworm（含 shell）
  # ============================================================
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: dev
    environment:
      API_PORT: "8080"
      META_DB_HOST: webdb-meta
      META_DB_PORT: "5432"
      # 运行时连接使用非超级用户 webdb_app_runtime（PR37 检定：生产 API 不得用超管 webdb）；
      # 迁移需 DDL 权限，用独立的 META_MIGRATE_USER（管理员 webdb）。
      META_DB_USER: webdb_app_runtime
      META_DB_PASSWORD: ${WEBDB_APP_PASSWORD:-change_me}
      META_DB_NAME: webdb_meta
      # 元数据库连接池有界配置（Owner 批准，2026-08）：缺失/非法/idle>open 时 API 拒绝启动（fail-closed）。
      # 支持从 deploy/compose/.env 或运行环境覆盖：未设置时回退默认 10 / 2 / 30m。
      META_DB_MAX_OPEN_CONNS: ${META_DB_MAX_OPEN_CONNS:-10}
      META_DB_MAX_IDLE_CONNS: ${META_DB_MAX_IDLE_CONNS:-2}
      META_DB_CONN_MAX_LIFETIME: ${META_DB_CONN_MAX_LIFETIME:-30m}
      META_MIGRATE_USER: webdb
      META_MIGRATE_PASSWORD: ${META_DB_PASSWORD:-change_me}
      # 可信演示 Principal（D01b）：必须与 demo-seed 权威 UUID 一致；
      # 缺失/非法时 API 拒绝启动（fail-closed），浏览器不自报身份。
      DEMO_PRINCIPAL_WORKSPACE_ID: ${DEMO_PRINCIPAL_WORKSPACE_ID:-f1160d75-26f7-46e0-b3e0-570ea65c232e}
      DEMO_PRINCIPAL_USER_ID: ${DEMO_PRINCIPAL_USER_ID:-73e8c8f0-83e4-4096-8400-15ca15073d6b}
      # 仅本地演示环境显式启用 TLS disable 的本地演示连接（WebDB 安全约束 #4）：
      # 默认关闭；非演示/生产不得设置。
      ALLOW_INSECURE_LOCAL_DEMO: "true"
      DEMO_PG_HOST: demo-pg
      DEMO_PG_PORT: "5432"
      DEMO_PG_USER: demo_reader
      DEMO_PG_PASSWORD: ${DEMO_PG_READER_PASSWORD:-change_me}
      DEMO_PG_NAME: webdb_demo
      DEMO_MYSQL_HOST: demo-mysql
      DEMO_MYSQL_PORT: "3306"
      DEMO_MYSQL_USER: ${DEMO_MYSQL_USER:-demo_reader}
      DEMO_MYSQL_PASSWORD: ${DEMO_MYSQL_READER_PASSWORD:-change_me}
      DEMO_MYSQL_NAME: webdb_demo
      # KEK 仅 env 注入（WEBDB_KEK_V{N}+WEBDB_ACTIVE_KEK_VERSION，非旧的 WEBDB_KEK 单变量）。
      WEBDB_KEK_V1: ${WEBDB_KEK_V1:-}
      WEBDB_ACTIVE_KEK_VERSION: ${WEBDB_ACTIVE_KEK_VERSION:-1}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      webdb-meta:
        condition: service_healthy
      demo-pg:
        condition: service_healthy
      demo-mysql:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      demo-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - webdb-frontend
      - webdb-backend
    restart: unless-stopped

  # ============================================================
  # Web 前端 — Vite 开发服务器 (dev target)，容器内监听 0.0.0.0:5173
  # ============================================================
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:3000:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - webdb-frontend
    restart: unless-stopped

# ==============================================================
# 持久化卷
# ==============================================================
volumes:
  webdb-meta-data:
  demo-pg-data:
  demo-mysql-data:

# ==============================================================
# 隔离网络
#   webdb-frontend  仅 web ↔ api；前端容器无法直连任何数据库
#   webdb-backend   仅 api ↔ 数据库；API 是唯一可达数据库的组件
# ==============================================================
networks:
  webdb-frontend:
    driver: bridge
  webdb-backend:
    driver: bridge
