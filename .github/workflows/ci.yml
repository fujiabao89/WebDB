name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-projects:
    name: Detect project checks
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      api: ${{ steps.detect.outputs.api }}
      contracts: ${{ steps.detect.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect Web, API and Contracts projects
        run: |
          if test -f apps/web/package.json; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f apps/api/go.mod; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f packages/contracts/package.json; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked environment files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.env|\.env\..+)$'; then
            echo "环境文件不得被提交。"
            exit 1
          fi
      - name: Require AI collaboration rules
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s .github/PULL_REQUEST_TEMPLATE.md
          test -s .github/CODEOWNERS

  # opencode-review.yml 的回归测试独立执行，不依赖被测 workflow 自身的自校验步骤。
  # 与 pr-policy.yml 一致，通过 GitHub Contents API 从 GITHUB_SHA 拉取测试脚本与
  # workflow 文件，不使用 actions/checkout：避免把 GITHUB_TOKEN 写入本地 git config
  # （仓库的 ecc orphan gitlink 使 persist-credentials: false 不可用，见 opencode-review.yml），
  # 也避免未固定 SHA 的 action 引用。
  # 注意：脚本随本 PR 首次引入，合并前脚本来源与 PR 相同；合并后本 job 以受保护版本运行，
  # 成为后续 PR 的独立回归门禁（ADR-019 决策 6）。
  opencode-review-policy:
    name: Opencode review workflow invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch opencode workflow policy files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          policy_root="$RUNNER_TEMP/opencode-policy"
          mkdir -p "$policy_root/.github/scripts" "$policy_root/.github/workflows"
          fetch_policy_file() {
            local source_path=$1
            local destination=$2
            local content
            content="$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$source_path?ref=$GITHUB_SHA"
            )"
            printf '%s' "$content" | jq --exit-status --raw-output '.content' | tr -d '\n' | base64 --decode >"$destination"
          }
          fetch_policy_file \
            '.github/scripts/validate-opencode-workflow.sh' \
            "$policy_root/.github/scripts/validate-opencode-workflow.sh"
          fetch_policy_file \
            '.github/scripts/test-opencode-workflow.sh' \
            "$policy_root/.github/scripts/test-opencode-workflow.sh"
          fetch_policy_file \
            '.github/workflows/opencode-review.yml' \
            "$policy_root/.github/workflows/opencode-review.yml"
      - name: Test opencode review workflow invariants
        run: bash "$RUNNER_TEMP/opencode-policy/.github/scripts/test-opencode-workflow.sh"

  web:
    name: Web checks
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Type check
        run: npm run typecheck --if-present
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present

  api:
    name: API checks
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.api == 'true'
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webdb
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: webdb_meta
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: change_me
          MYSQL_DATABASE: webdb_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Metadata integration test
        run: go test -p=1 -tags=integration ./internal/metadata/... ./internal/credentials/...
        env:
          META_DB_HOST: localhost
          META_DB_PORT: "5432"
          META_DB_USER: webdb
          META_DB_PASSWORD: change_me
          META_DB_NAME: webdb_meta
      - name: Setup read-only demo users
        run: |
          PGPASSWORD=change_me psql -h localhost -U webdb -d webdb_meta -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname='demo_reader') THEN
                CREATE ROLE demo_reader WITH LOGIN PASSWORD 'change_me';
              END IF;
            END
            \$\$;
            GRANT CONNECT ON DATABASE webdb_meta TO demo_reader;
            GRANT USAGE ON SCHEMA public TO demo_reader;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO demo_reader;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO demo_reader;
          "
          mysql -h 127.0.0.1 -u root -pchange_me -e "
            CREATE USER IF NOT EXISTS 'demo_reader'@'%' IDENTIFIED BY 'change_me';
            GRANT SELECT ON webdb_demo.* TO 'demo_reader'@'%';
            FLUSH PRIVILEGES;
          " 2>/dev/null || true
      - name: Seed test data (admin)
        run: |
          PGPASSWORD=change_me psql -h localhost -U webdb -d webdb_meta -c "
            CREATE TABLE IF NOT EXISTS employees (id SERIAL PRIMARY KEY, first_name TEXT NOT NULL);
            INSERT INTO employees (first_name) VALUES
              ('Alice'),('Bob'),('Charlie'),('David'),('Eve'),('Frank'),('Grace')
            ON CONFLICT DO NOTHING;
          "
          mysql -h 127.0.0.1 -u root -pchange_me webdb_demo -e "
            CREATE TABLE IF NOT EXISTS employees (id INT AUTO_INCREMENT PRIMARY KEY, first_name VARCHAR(255) NOT NULL);
            INSERT IGNORE INTO employees (id,first_name) VALUES
              (1,'Alice'),(2,'Bob'),(3,'Charlie'),(4,'David'),(5,'Eve'),(6,'Frank'),(7,'Grace');
          "
      - name: Adapter integration test
        run: go test -tags=integration ./internal/adapter/...
        env:
          DEMO_PG_HOST: localhost
          DEMO_PG_PORT: "5432"
          DEMO_PG_USER: demo_reader
          DEMO_PG_PASSWORD: change_me
          DEMO_PG_NAME: webdb_meta
          DEMO_MYSQL_HOST: 127.0.0.1
          DEMO_MYSQL_PORT: "3306"
          DEMO_MYSQL_USER: demo_reader
          DEMO_MYSQL_PASSWORD: change_me
          DEMO_MYSQL_NAME: webdb_demo

  contracts:
    name: Contracts checks
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.contracts == 'true'
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
