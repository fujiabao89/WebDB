name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-projects:
    name: Detect project checks
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      api: ${{ steps.detect.outputs.api }}
      contracts: ${{ steps.detect.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect Web, API and Contracts projects
        run: |
          if test -f apps/web/package.json; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f apps/api/go.mod; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if test -f packages/contracts/package.json; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked environment files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.env|\.env\..+)$'; then
            echo "环境文件不得被提交。"
            exit 1
          fi
      - name: Require AI collaboration rules
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s .github/PULL_REQUEST_TEMPLATE.md
          test -s .github/CODEOWNERS

  web:
    name: Web checks
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Type check
        run: npm run typecheck --if-present
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present

  api:
    name: API checks
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.api == 'true'
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webdb
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: webdb_meta
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: change_me
          MYSQL_DATABASE: webdb_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Metadata integration test
        run: go test -tags=integration ./internal/metadata/...
        env:
          META_DB_HOST: localhost
          META_DB_PORT: "5432"
          META_DB_USER: webdb
          META_DB_PASSWORD: change_me
          META_DB_NAME: webdb_meta
      - name: Adapter integration test
        run: go test -tags=integration ./internal/adapter/...
        env:
          DEMO_PG_HOST: localhost
          DEMO_PG_PORT: "5432"
          DEMO_PG_USER: webdb
          DEMO_PG_PASSWORD: change_me
          DEMO_PG_NAME: webdb_meta
          DEMO_MYSQL_HOST: 127.0.0.1
          DEMO_MYSQL_PORT: "3306"
          DEMO_MYSQL_USER: root
          DEMO_MYSQL_PASSWORD: change_me
          DEMO_MYSQL_NAME: webdb_demo

  contracts:
    name: Contracts checks
    runs-on: ubuntu-latest
    needs: detect-projects
    if: needs.detect-projects.outputs.contracts == 'true'
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
