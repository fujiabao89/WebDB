name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: PR contract
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Validate title and required PR sections
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|build|ci)(\([a-z0-9/_-]+\))?!?: .+'; then
            echo "PR 标题必须使用 Conventional Commits，例如 feat(api): add read-only query policy"
            exit 1
          fi

          for section in '## 任务' '## 改动与风险' '## 验证证据' '## WebDB 安全核对' '## AI 协作与交接'; do
            if ! printf '%s' "$PR_BODY" | grep -Fq "$section"; then
              echo "缺少 PR 模板章节：$section"
              exit 1
            fi
          done

          # 检测未填写的模板占位符。模板占位符特征为 <!-- 后跟中文提示（例如/无则填/Low / Medium/人类或/Codex 链接）。
          # 显式放行 CodeRabbit 等工具自动生成的 HTML 注释块（<!-- This is an auto-generated comment / <!-- end of auto-generated comment）。
          # 不检测泛化关键词 TODO/待填写：它们可能出现在 CodeRabbit summary 描述中导致误判，且模板未使用这些词。
          if printf '%s' "$PR_BODY" | grep -Ev '<!-- (This is an auto-generated comment|end of auto-generated comment)' | grep -Eq '<!-- (例如|无则填|Low / Medium|人类或|Codex 链接)'; then
            echo "PR 描述仍包含未填写的模板内容。"
            exit 1
          fi
