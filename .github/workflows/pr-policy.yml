name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: PR contract
    runs-on: ubuntu-latest
    steps:
      - name: Fetch policy files from the pull request merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          policy_root="$RUNNER_TEMP/pr-policy"
          mkdir -p "$policy_root/.github/scripts" "$policy_root/.github/workflows"

          fetch_policy_file() {
            local source_path=$1
            local destination=$2
            local response
            local content
            response="$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$source_path?ref=$GITHUB_SHA"
            )"
            content="$(printf '%s' "$response" | jq --exit-status --raw-output '.content')"
            printf '%s' "$content" | tr -d '\n' | base64 --decode >"$destination"
          }

          fetch_policy_file \
            '.github/workflows/pr-policy.yml' \
            "$policy_root/.github/workflows/pr-policy.yml"
          fetch_policy_file \
            '.github/scripts/test-pr-metadata.sh' \
            "$policy_root/.github/scripts/test-pr-metadata.sh"
          fetch_policy_file \
            '.github/scripts/validate-pr-metadata.sh' \
            "$policy_root/.github/scripts/validate-pr-metadata.sh"

      - name: Test PR metadata policy
        run: bash "$RUNNER_TEMP/pr-policy/.github/scripts/test-pr-metadata.sh"

      - name: Validate Linear metadata and required PR sections
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/pr-policy/.github/scripts/validate-pr-metadata.sh" "$PR_TITLE" "$PR_HEAD_REF" "$PR_BODY"

          for section in '## 任务' '## 改动与风险' '## 验证证据' '## WebDB 安全核对' '## AI 协作与交接'; do
            if ! printf '%s' "$PR_BODY" | grep -Fq "$section"; then
              echo "缺少 PR 模板章节：$section"
              exit 1
            fi
          done

          # 检测未填写的模板占位符。模板占位符特征为 <!-- 后跟中文提示（例如/无则填/Low / Medium/人类或/Codex 链接）。
          # 完整移除 CodeRabbit 等工具自动生成的 HTML 注释块（从开标记到闭标记之间的所有行），
          # 避免块内部包含占位符文字时误判。sed 范围删除比 grep -Ev 单行过滤更稳健。
          # 不检测泛化关键词 TODO/待填写：它们可能出现在 CodeRabbit summary 描述中导致误判，且模板未使用这些词。
          body_without_generated_comments="$(
            printf '%s' "$PR_BODY" |
              sed '/<!-- This is an auto-generated comment/,/<!-- end of auto-generated comment/d'
          )"
          if printf '%s' "$body_without_generated_comments" |
            grep -Eq '<!-- (例如|无则填|Low / Medium|人类或|Codex 链接)'; then
            echo "PR 描述仍包含未填写的模板内容。"
            exit 1
          fi
