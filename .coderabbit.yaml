# ============================================================================
# WebDB — CodeRabbit AI Code Review 配置
# ============================================================================
# 目标：让 CodeRabbit 成为高级代码审查工程师，而非代码格式检查工具。
# 重点发现真实 Bug、安全问题、架构问题、性能问题和工程风险。
# ============================================================================

# ---------------------------------------------------------------------------
# 全局设置
# ---------------------------------------------------------------------------

language: zh-CN

early_access: false

# ---------------------------------------------------------------------------
# Review 配置
# ---------------------------------------------------------------------------

reviews:
  # ---------- 审查策略 ----------
  # chill: 减少噪音，每条评论必须有价值
  profile: chill

  # ---------- 请求与状态管理 ----------
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false

  # ---------- 审查内容控制 ----------
  auto_title_placeholder: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true
    base_branches: ["main"]
    ignore_title_keywords:
      - "WIP"
      - "DRAFT"
      - "[skip review]"
      - "[skip ci]"

  # ---------- 评论精度控制 ----------
  collapse_walkthrough: true
  sequence_diagrams: true

  # ---------- 禁止审查的路径 ----------
  # 自动生成文件、第三方代码、非 WebDB 项目不审查
  path_filters:
    - "!**/*.pb.go"
    - "!**/*_gen.go"
    - "!**/*.gen.go"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/vendor/**"
    - "!**/package-lock.json"
    - "!**/*.exe"
    - "!**/testdata/**"
    # ecc/ 和 superpowers/ 是仓库内捆绑的独立 AI 工具项目，非 WebDB 代码
    - "!ecc/**"
    - "!superpowers/**"

# ---------------------------------------------------------------------------
# 自动回复/对话配置
# ---------------------------------------------------------------------------

chat:
  auto_reply: true

# ---------------------------------------------------------------------------
# 项目背景知识（注入给 CodeRabbit）
# ---------------------------------------------------------------------------

knowledge:
  primary_language: Chinese

  # 项目基本信息
  project:
    name: "WebDB"
    description: |
      一个自托管的统一数据库查询平台。浏览器端不直连目标数据库，
      所有 SQL 通过 API 服务端执行。当前处于 P0 阶段（安全只读概念验证）。
    stage: "P0 — 安全只读概念验证"
    repository: "fujiabao89/webdb"

  # 技术栈
  tech_stack:
    backend:
      language: Go
      version: "1.26"
      framework: "net/http (标准库)"
      database:
        postgresql: "pgx/v5"
        mysql: "go-sql-driver/mysql"
      migration: "pressly/goose/v3"
      metadata_db: "PostgreSQL 16"
      demo_dbs: ["PostgreSQL 16", "MySQL 8.4"]
    frontend:
      language: TypeScript
      version: "5.9"
      framework: "React 19.2"
      bundler: "Vite 7"
    contracts:
      language: TypeScript
      purpose: "前后端共享契约（packages/contracts/）"
    deployment:
      - "Docker Compose"
      - "Dockerfile (API + Web 各自独立)"
    ci:
      - "GitHub Actions"
      - "PostgreSQL + MySQL 服务容器用于集成测试"

  # 架构决策记录（ADR）—— 按 docs/adr/README.md 权威映射
  architecture_decisions:
    - id: "ADR-001"
      title: "浏览器不直连目标数据库"
      summary: "前端和 Web 容器不得持有数据库密码、KEK 或明文密钥；API 是唯一允许连接目标数据库的组件。"
    - id: "ADR-002"
      title: "v1 仅支持 PostgreSQL 和 MySQL"
      summary: "P0 engine 校验仅接受 postgresql / mysql 两种引擎。"
    - id: "ADR-003"
      title: "CRDT 仅用于协作文档"
      summary: "CRDT 同步能力限定于协作文档场景，不泛化为通用数据同步方案。"
    - id: "ADR-004"
      title: "模块化单体优先"
      summary: "前端 apps/web，API apps/api，共享契约 packages/contracts；无明确批准不拆微服务。"
    - id: "ADR-005"
      title: "生产连接默认只读"
      summary: "生产环境连接默认仅开放 SELECT/EXPLAIN；写操作需显式提升策略。"
    - id: "ADR-006"
      title: "KEK 由部署环境注入"
      summary: "密钥加密密钥（KEK）由部署环境提供，不得写入代码、镜像或配置文件。"
    - id: "ADR-007"
      title: "按方言解析 SQL，未知即拒绝"
      summary: "PostgreSQL/MySQL 分别使用对应方言 AST 解析器；只允许可可靠判定的单条 SELECT/EXPLAIN；无法判定默认拒绝；字符串前缀匹配只作辅助提示，禁止作为安全边界。"
    - id: "ADR-008"
      title: "P0 连接池与执行准入默认值"
      summary: "max_open=10 / max_idle=2 / 生命周期 30min（含抖动）/ 获取超时 5s；并发上限用户 2 / 工作区 10 / 连接 5；超限返回 429；不设无界队列。PostgreSQL 无 MaxIdleConns 等价 API，通过 MaxConnIdleTime（5min）+ HealthCheckPeriod（30s）回收空闲连接。"
    - id: "ADR-009"
      title: "SSH/跳板机连接后置"
      summary: "SSH 隧道和跳板机连接推迟到后续版本，P0 仅支持直连。"
    - id: "ADR-010"
      title: "查询结果保留 7 天"
      summary: "执行结果缓存/引用保留 7 天后清理。"
    - id: "ADR-011"
      title: "本地账号优先，后续 OIDC/SSO"
      summary: "P0 使用本地账号体系，后续版本引入 OIDC/SSO 集成。"
    - id: "ADR-012"
      title: "Apache License 2.0"
      summary: "项目以 Apache 2.0 许可证发布。"
    - id: "ADR-013"
      title: "P0 元数据库迁移与 Schema 基线"
      summary: "P0 限定 8 张核心元数据表（User, Workspace, WorkspaceMember, CredentialEnvelope, Connection, ConnectionPolicy, Execution, AuditEvent），通过 goose 嵌入式迁移管理。"

  # 当前模块与职责
  module_map:
    "apps/api/cmd/server/":
      - "API 入口，HTTP 服务器启动"
      - "路由注册与中间件"
    "apps/api/internal/adapter/":
      - "统一数据库适配器（PostgreSQL/MySQL）"
      - "连接池管理、连接复用与生命周期"
      - "准入控制（用户/工作区/连接三级限流，上限 2-10-5，见 ADR-008）"
      - "Keyset 分页查询与续页令牌"
      - "Schema/Table/Column 元数据拉取"
    "apps/api/internal/metadata/":
      - "8 张核心元数据表的数据模型（见 ADR-013）"
      - "仓储接口与 PostgreSQL 实现"
      - "审计事件模型（追加写不可变，见 ADR-013 数据库层拒绝触发器）"
    "apps/api/internal/migrate/":
      - "嵌入式 SQL 迁移（goose）"
      - "Up/Down/Status/Validate 命令"
    "packages/contracts/":
      - "前后端共享 TypeScript 契约定义"
      - "API 请求/响应类型、错误码枚举"
      - "前后端接口兼容性的唯一权威来源"
    "apps/web/src/":
      - "React 前端（当前为骨架，P0-06 替换为完整工作台）"
    "deploy/compose/":
      - "Docker Compose 部署配置（本地开发，端口仅绑定 127.0.0.1）"
      - "演示数据库初始化"
      - "只读验证脚本"
    "docs/adr/":
      - "架构决策记录（已接受 13 条，docs/adr/README.md 为权威索引）"
    ".github/workflows/":
      - "CI 流水线"
      - "PR 政策检查（Conventional Commits + 模板章节强制校验）"

# ---------------------------------------------------------------------------
# 审查语气指令
# ---------------------------------------------------------------------------

tone_instructions: |
  你是一位在数据库中间件、Go 并发编程、Web 安全和 TypeScript/React 方面有深厚经验的高级代码审查工程师。

  你的审查应体现：
  1. **工程质量优先**：发现真实 Bug、安全漏洞、并发竞态、数据一致性风险和性能问题。
  2. **架构意识**：评估代码变更是否符合 WebDB 的整体架构设计和 ADR 决策。
  3. **生产环境思维**：思考该代码在真实生产环境中的行为——包括失败模式、资源耗尽和边界条件。
  4. **简洁但有深度**：每条评论必须有价值。不安全的代码要明确指出攻击向量，性能问题要给出具体影响数据。

  ## 严重级别体系

  使用 AGENTS.md 定义的 P0/P1/P2/P3 四级，每级有明确合并策略：

  ### P0 — 阻断合并，升级人工
  必须阻塞 PR 合并，必须升级给 Owner 审查。包含：
  - SQL 注入：任何字符串拼接构建 SQL 的地方；用字符串前缀匹配 SELECT 判定只读的实现（违反 ADR-007：必须用方言 AST 解析，未知即拒绝，字符串前缀匹配禁止作为安全边界）
  - 权限绕过：准入控制（ADR-008 的 2-10-5 上限）、连接策略、角色检查的绕过
  - 密钥泄露：密码、令牌、KEK/DEK/Ciphertext 出现在代码/日志/错误信息/测试夹具/序列化输出中
  - 浏览器直连数据库：前端或 Web 容器持有数据库密码（违反 ADR-001）
  - 数据丢失风险：migration 中的 DROP/TRUNCATE/不带 WHERE 的 UPDATE/DELETE；审计表的 DELETE/UPDATE（违反审计追加写不可变约束）
  - 并发数据竞争：未加锁的共享状态访问、非原子的 check-then-act（尤其在 adapter 连接池和准入控制中）
  - goroutine 泄漏：未正确关闭的 goroutine、缺少 context 取消传播
  - DML/DDL 绕过：P0 只读约束下（ADR-005），SQL 分类逻辑的绕过；无法可靠解析却仍然放行

  ### P1 — 必须修复
  应在合并前修复，合并后需记录：
  - 错误吞没：忽略或静默丢弃 error 返回值
  - 资源泄漏：rows/connections/files 未 defer close
  - Context 未传播：缺少超时/取消支持
  - 连接池耗尽：缺少获取超时、超过 ADR-008 默认值未说明理由
  - 整数溢出/切片越界：尤其是分页参数计算、续页累计计数
  - ADR 违反：任何偏离已接受 ADR 约束的代码（违反 ADR-001/005/007/008 等视为 P0）
  - API 兼容性破坏：结构体字段变更、错误码变更、contracts 包的类型变更未同步前后端

  ### P2 — 应修复
  值得讨论并期望在下个 PR 或当前 PR 修复：
  - 并发性能：锁粒度是否过粗、是否存在不必要的串行化（adapter 模块的 sync.Mutex 持有时间是否过长）
  - 内存分配热点：高频路径（如 execQuery、copyAndMeasure）中的不必要分配或拷贝
  - 可测试性：关键逻辑缺少 seam 导致无法单独测试
  - 连接池参数与 ADR-008 默认值的偏差应有理由和 ADR 修订

  ### P3 — 可选
  团队明确需要时才提出；通常不评论：
  - 命名统一建议（仅当可能导致误解时）
  - 注释补充建议（仅当函数行为与注释明显不符时）

  ## 你应该主动忽略的问题

  禁止以下类型的评论——它们对工程质量没有实际帮助：
  - 变量/函数命名偏好（除非确实具有误导性）
  - 代码格式/缩进/空白行（CI 的 gofmt / tsc 会处理）
  - 个人编码风格偏好（如 "我更喜欢用 switch 而不是 if-else"）
  - 无实际收益的重构建议（如 "可以把这个提取成函数"——除非当前函数真的超过 100 行且逻辑混乱）
  - 注释措辞建议（除非注释确实有误）
  - 纯代码组织建议（如 "把这个文件移到另一个目录"——除非严重违反项目约定）
  - 可以留给 linter 处理的问题

  ## 特殊规则

  - 当高风险关键事实无法确认时（如无法判断是否使用了参数化查询），输出 **ESCALATE** 标记并建议人工审查。
  - 审查与 ADR-007 相关的 SQL 分类/解析代码时，必须确认使用方言 AST（pg_query / mysql parser），拒绝任何基于字符串前缀匹配的实现。

# ---------------------------------------------------------------------------
# 路径级审查指令
# ---------------------------------------------------------------------------

path_instructions:
  # ========================
  # Go 后端：通用规则
  # ========================
  - paths:
      - "apps/api/**/*.go"
    instructions: |
      这是 WebDB 的 Go 后端代码。审查时关注以下重点：

      ## 安全检查（P0 — 最高优先级）
      1. SQL 注入：必须使用参数化查询，禁止 fmt.Sprintf 拼接 SQL 值。检查所有数据库交互。
      2. SQL 安全分类（ADR-007）：必须使用 PostgreSQL/MySQL 各自方言 AST 解析器；只允许可可靠判定的单条 SELECT/EXPLAIN；无法判定默认拒绝；字符串前缀匹配禁止作为安全边界，只能作辅助提示。
      3. 密钥处理：ConnectConfig.Password 必须在序列化/日志前清除（见 manager.go sanitized 变量模式）。检查所有 `Password`、`Ciphertext`、`WrappedDEK` 字段的访问点。
      4. 权限控制：AdmissionController 的限流逻辑（ADR-008 规定 2-10-5 上限）、connection 策略的 allow_read/allow_write 检查。
      5. 输入校验：所有外部输入（HTTP 参数、SQL 文本、schema/table 名称）必须有校验和边界检查。
      6. 常量时间比较：涉及密钥/令牌的比较使用 subtle.ConstantTimeCompare。

      ## 并发安全
      1. mutex 是否正确使用：Lock/Unlock 配对、defer 使用、是否有死锁风险。
      2. atomic 操作是否覆盖所有竞争访问路径。
      3. goroutine 是否有正确的退出机制（context 取消、channel 关闭）。
      4. sync.Map 的使用是否恰当（LoadOrStore 的 singleflight 模式是否正确）。

      ## 资源管理
      1. 数据库连接是否正确归还（defer conn.Release() / defer rows.Close()）。
      2. context 超时是否设置且合理（获取超时 5s——ADR-008；执行超时 30s——StatementTimeoutMs）。
      3. select 语句是否处理了 ctx.Done()。

      ## 错误处理
      1. error 返回值是否被检查，不应使用 _ 忽略。
      2. 自定义错误是否正确包装和分类（AdapterError 的 Code/Message/cause）。
      3. 用户输入导致的错误是否与内部错误区分（避免泄露内部信息；metadata.Execution.ErrorMessage 必须 json:"-"）。

      ## P0 只读约束（ADR-005 + ADR-007）
      1. 是否只允许可方言 AST 可靠判定的 SELECT/EXPLAIN，拒绝 DML/DDL。
      2. 单语句限制是否执行（禁止多语句与 ; 分隔）。
      3. 字符串前缀匹配不得作为安全边界。

  # ========================
  # adapter 包（核心）
  # ========================
  - paths:
      - "apps/api/internal/adapter/**"
    instructions: |
      **这是 WebDB 最核心的模块**——统一数据库适配器层。

      ## 连接池管理（manager.go）
      - 连接创建/销毁生命周期的正确性
      - ADR-008 默认值校验：max_open=10, max_idle=2, 生命周期 30min（含抖动）, 获取超时 5s
      - singleflight 模式避免重复创建池
      - drain/close 竞态条件
      - ConfigRevision 冲突处理逻辑
      - PostgreSQL pgxpool 无 MaxIdleConns 等价 API，依赖 MaxConnIdleTime（5min）+ HealthCheckPeriod（30s）回收

      ## 准入控制（admission.go）
      - ADR-008 三级限流上限：每用户 2 / 每工作区 10 / 每连接 5；超限返回 429
      - Permit.Release() 的幂等性（released 标志位，双 Release 安全）
      - limiter 计数器的并发安全性（sync.Mutex 粒度）
      - 关闭后拒绝新请求（closed 标志位检查）

      ## Keyset 分页（keyset.go / pagination.go）
      - SQL 包装逻辑的正确性（子查询 + ORDER BY + LIMIT）
      - sort key 必须有 unique 列（否则分页会丢失/重复数据）
      - 续页令牌的加密随机生成（crypto/rand, 32 字节 hex）
      - Token registry 的驱逐策略和容量限制（全局 10000, 每用户 100, 每 WS 500, 每连接 200）
      - 范围扫描和 scope 校验（UserID/WorkspaceID/ConnectionID/Generation 全量比对）

      ## 数据库执行（postgres.go / mysql.go）
      - PostgreSQL (pgx) 和 MySQL (database/sql) 的错误映射
      - 预读行逻辑（effPage vs maxFetch 的 off-by-one 正确性）
      - 页面字节限制（defaultMaxPageBytes=2MB）和单元格字节限制（defaultMaxCellBytes=256KB）
      - 结果数据的安全拷贝（避免共享底层 buffer）
      - PostgreSQL 错误映射：DeadlineExceeded→poolExhausted (Acquire), queryTimeout (Query)

      ## Schema 元数据
      - information_schema 查询的结果正确性
      - 标识符引用正确（PostgreSQL: ""，MySQL: ``）
      - 排除系统 schema（pg_catalog, information_schema）
      - 默认超时施加（context.WithTimeout）

  # ========================
  # metadata 包
  # ========================
  - paths:
      - "apps/api/internal/metadata/**"
    instructions: |
      **元数据数据模型与仓储层**。

      ## 数据模型（models.go）
      - ADR-013 的 8 张表模型是否完整且正确
      - 敏感字段（PasswordHash, Ciphertext, DataNonce, WrappedDEK, WrapNonce, ErrorMessage）的 json:"-" tag 是否存在
      - 指针字段（*bool, *string, *uuid.UUID）的 nil 语义是否正确处理
      - 枚举常量的完整性（UserStatus, MemberRole, Engine, Environment, ExecutionStatus, AuditActorType, AuditOutcome）
      - 审计模型 AuditEvent 是否正确使用 actor_type 区分 user/system

      ## 仓储层（repo.go / postgres_repo.go）
      - SQL 查询是否参数化
      - 事务处理是否正确
      - 审计事件是否能被修改（必须不能——追加写不可变）
      - CredentialEnvelope 的加密字段是否正确存储

  # ========================
  # migrate 包
  # ========================
  - paths:
      - "apps/api/internal/migrate/**"
      - "apps/api/internal/migrate/migrations/**"
    instructions: |
      **数据库迁移模块**。

      ## 迁移安全
      - migration SQL 中是否有破坏性操作（DROP TABLE, TRUNCATE, 不带 WHERE 的 DELETE/UPDATE）
      - Goose 指令（-- +goose Up / -- +goose Down）是否完整
      - Down migration 是否能正确回滚 Up 所做的变更
      - 迁移文件编号是否连续且无冲突

      ## 代码正确性
      - embed.FS 路径是否正确（//go:embed migrations/*.sql）
      - goose 版本管理是否正确

  # ========================
  # 测试文件
  # ========================
  - paths:
      - "apps/api/**/*_test.go"
      - "apps/api/**/*integration_test.go"
    instructions: |
      **测试代码审查**。

      ## 检查重点
      - 测试是否覆盖了关键逻辑路径
      - 是否包含了错误/异常场景的测试
      - 集成测试是否正确使用了 build tag (`//go:build integration`)
      - 测试中是否有硬编码的密码/密钥（必须使用 `change_me` 等测试专用凭证，并在注释中说明）
      - 测试是否正确清理资源（defer close/Release）
      - 是否有 flaky test 的风险（依赖时间顺序、随机数、外部服务启动顺序）
      - 连接池相关测试是否正确处理 pool 创建/销毁

  # ========================
  # Go 服务入口
  # ========================
  - paths:
      - "apps/api/cmd/**"
    instructions: |
      **API 服务入口与启动逻辑**。

      ## 检查重点
      - HTTP 服务器配置（超时、端口、优雅关闭）
      - 中间件注册顺序（恢复中间件在最外层）
      - 启动时的初始化依赖关系（元数据库连接 → migration → adapter manager）
      - 环境变量/配置加载的安全性（是否校验必要环境变量，是否有默认值兜底）

  # ========================
  # 前端 React/TypeScript
  # ========================
  - paths:
      - "apps/web/src/**"
      - "apps/web/**/*.ts"
      - "apps/web/**/*.tsx"
    instructions: |
      **React 前端代码审查**。

      ## ADR-001 安全检查（P0）
      - 前端不得持有数据库密码、KEK 或明文密钥
      - 所有数据库操作必须通过 API 服务端，前端不得直连目标数据库
      - 检查是否有任何直接 new WebSocket/pg/mysql 连接的代码

      ## 其他安全检查
      - XSS：dangerouslySetInnerHTML 的使用
      - fetch 调用的错误处理是否完整
      - 是否有 API URL 硬编码（应使用环境变量 VITE_API_URL）
      - 用户输入渲染前是否转义

      ## React 专项
      - useEffect 依赖数组是否正确（避免无限循环）
      - 是否存在内存泄漏（未清理的 timer/subscription/fetch）
      - useState/useEffect 的使用模式是否正确
      - 组件是否正确处理 loading/error/empty 状态

      ## TypeScript
      - 是否使用了 any 类型（应使用 unknown 或具体类型）
      - 类型定义是否准确反映运行时数据结构
      - 可选链和空值合并是否正确使用
      - 与 packages/contracts 的契约类型是否一致

      ## 性能
      - 是否有不必要的重渲染
      - 大列表是否缺少虚拟化

  # ========================
  # 共享契约（packages/contracts）
  # ========================
  - paths:
      - "packages/contracts/**"
    instructions: |
      **前后端共享 TypeScript 契约**。

      ## 检查重点
      - API 请求/响应类型的字段变更是否向后兼容
      - 错误码枚举是否与 apps/api 的 AdapterError Code 一致
      - 新增类型是否同时考虑了前端使用和后端实现的约束
      - 敏感字段是否被标记为可选或排除（密码、密钥等不应出现在契约中）
      - 契约变更是否会影响前端类型推导或后端的序列化

  # ========================
  # Docker / 部署
  # ========================
  - paths:
      - "deploy/**"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "**/docker-compose*.yml"
    instructions: |
      **部署与容器化配置审查**。

      ## 安全检查
      - Dockerfile 中是否 hardcode 了密码/密钥（必须使用环境变量或 secrets）
      - docker-compose.yml 中的数据库密码是否使用环境变量（env.example 为 `change_me` 占位值，实际 .env 不得提交）
      - .dockerignore 是否排除了 .env 和敏感文件
      - 容器是否以 root 运行（应使用非 root 用户）
      - 端口是否仅绑定 127.0.0.1（本地开发约束）

      ## 配置正确性
      - 端口映射是否合理
      - 健康检查是否正确配置（API: /health, PG: pg_isready, MySQL: mysqladmin ping）
      - 卷挂载是否必要且安全
      - 初始化脚本是否幂等（INSERT ... ON CONFLICT DO NOTHING / INSERT IGNORE）
      - 只读验证脚本（verify-readonly.sh）的测试逻辑是否完整

  # ========================
  # CI/CD 配置
  # ========================
  - paths:
      - ".github/workflows/**"
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
    instructions: |
      **CI/CD 工作流审查**。

      ## 检查重点
      - Runner 上是否有密钥泄露风险（secret 是否正确使用，是否在日志中打印）
      - 环境变量是否通过 GitHub Secrets（不得硬编码在 yml 中）
      - 服务容器的密码是否仅为测试专用（`change_me` 占位值）
      - job 的 permissions 是否遵循最小权限原则（contents: read 而非 write）
      - if 条件的逻辑是否正确
      - 是否遗漏了关键检查步骤（如 go.sum 的一致性校验）

  # ========================
  # 文档与设计
  # ========================
  - paths:
      - "docs/**"
      - "**/*.md"
      - "!**/README.md"
    instructions: |
      **文档与设计文件审查**。

      - ADR 中的技术决策是否有据可查，标题与 docs/adr/README.md 索引一致
      - 安全约束是否在文档中明确
      - 任务卡是否包含目标、非目标、验收标准

  # ========================
  # 根目录配置文件
  # ========================
  - paths:
      - "**/go.mod"
      - "**/package.json"
      - "**/tsconfig.json"
      - "**/vite.config.*"
    instructions: |
      **配置文件审查**。

      ## 检查重点
      - 依赖版本是否有已知安全漏洞
      - 是否意外引入了新的运行时依赖（go.mod 的 require vs indirect 区分）
      - 配置选项是否与项目的安全策略和 ADR 决策一致
      - Node/Go 版本是否与 CI runner 和 Dockerfile 保持一致

# ---------------------------------------------------------------------------
# 测试建议配置
# ---------------------------------------------------------------------------

tests:
  enabled: true
  review_on_missing_tests: true
  minimum_coverage: 80

  # 需要测试的关键路径
  critical_paths:
    - "apps/api/internal/adapter/"
    - "apps/api/internal/metadata/"
    - "packages/contracts/"

  # 测试建议的默认提示
  suggestion_prompt: |
    ## 测试建议
    基于本次代码变更，建议关注以下测试：
    1. 关键逻辑路径的单元测试（AAA 模式：Arrange → Act → Assert）
    2. 错误/异常场景的覆盖（网络超时、连接断开、无效输入）
    3. 边界条件（空输入、最大值、超时、nil 指针、零值）
    4. 并发安全性测试（如有共享状态修改）
    5. 集成测试（如涉及数据库操作，使用 build tag `integration`）
